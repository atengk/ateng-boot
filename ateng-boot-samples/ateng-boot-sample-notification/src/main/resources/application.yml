server:
  port: 8080

spring:
  application:
    name: ateng-boot-sample-notification

ateng:
  boot:
    notification:
      enabled: true
      default-channel: ops-alert
      channels:
        ops-alert:
          platform: wecom
          webhook: http://localhost:18080/webhook/wecom
          # 企微 Webhook 官方仅使用 URL 中的 key 鉴权，无 secret 加签机制
          connect-timeout: 3s
          read-timeout: 5s
          permits-per-minute: 20
        dingtalk-dev:
          platform: dingtalk
          webhook: http://localhost:18080/webhook/dingtalk
          secret: SEC_DINGTALK_SECRET_SAMPLE
          connect-timeout: 3s
          read-timeout: 5s
          permits-per-minute: 20
        feishu-ops:
          platform: feishu
          webhook: http://localhost:18080/webhook/feishu
          secret: SEC_FEISHU_SECRET_SAMPLE
          connect-timeout: 3s
          read-timeout: 5s
          permits-per-minute: 100
        generic-monitor:
          platform: generic
          webhook: http://localhost:18080/webhook/generic
          secret: SEC_GENERIC_SECRET_SAMPLE
          connect-timeout: 3s
          read-timeout: 5s
          permits-per-minute: 60
      alert:
        enabled: true
        default-channel: ops-alert
        suppress-window: 60s
        desensitize-keys:
          - password
          - secret
          - token
          - credential
          - idCard
          - mobile
