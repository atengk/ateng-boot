spring:
  application:
    name: ateng-boot-sample-core
  main:
    web-application-type: none

ateng:
  boot:
    async:
      enabled: true
      core-pool-size: 4
      max-pool-size: 8
      queue-capacity: 100
      thread-name-prefix: sample-core-async-
      pools:
        export:
          core-pool-size: 2
          max-pool-size: 4
          queue-capacity: 50
          thread-name-prefix: sample-export-async-
          rejected-policy: CALLER_RUNS
