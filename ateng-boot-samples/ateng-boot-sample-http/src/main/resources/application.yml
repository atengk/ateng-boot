server:
  port: 8080

spring:
  application:
    name: ateng-boot-sample-http

ateng:
  boot:
    http:
      enabled: true
      engine: auto
      pool:
        max-connections: 200
        max-per-route: 50
        connect-timeout: 3s
        read-timeout: 10s
        connection-request-timeout: 2s
        idle-timeout: 60s
        validate-after-inactivity: 2s
      tracing:
        enabled: true
      logging:
        enabled: true
      clients:
        user-service:
          base-url: ${sample.user-service.url:http://localhost:8080}
          connect-timeout: 2s
          read-timeout: 5s
          propagate-context: true
        wechat-pay:
          base-url: ${sample.wechat-pay.url:https://api.mch.weixin.qq.com}
          connect-timeout: 2s
          read-timeout: 5s
          propagate-context: false
        order-service:
          base-url: ${sample.order-service.url:http://localhost:8080}
          connect-timeout: 2s
          read-timeout: 5s
          propagate-context: true
        scoped-proxy-client:
          base-url: http://proxy-target.internal:8080
          connect-timeout: 2s
          read-timeout: 5s
          proxy:
            enabled: true
            host: 127.0.0.1
            port: 8888
