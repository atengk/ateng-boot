# 本地真实中间件联调模板文件（复制为 application-local.yml 并在本地环境激活）
# 严禁将真实凭据填入本 example 文件，真实配置文件 application-local.yml 已被 .gitignore 忽略
spring:
  datasource:
    dynamic:
      datasource:
        master:
          url: jdbc:mysql://YOUR_MYSQL_HOST:YOUR_MYSQL_PORT/sample_ds_master?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
          username: YOUR_MYSQL_USERNAME
          password: YOUR_MYSQL_PASSWORD
          driver-class-name: com.mysql.cj.jdbc.Driver
        slave:
          url: jdbc:mysql://YOUR_MYSQL_HOST:YOUR_MYSQL_PORT/sample_ds_slave?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
          username: YOUR_MYSQL_USERNAME
          password: YOUR_MYSQL_PASSWORD
          driver-class-name: com.mysql.cj.jdbc.Driver
        tenant_1001:
          url: jdbc:mysql://YOUR_MYSQL_HOST:YOUR_MYSQL_PORT/sample_ds_tenant_1001?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
          username: YOUR_MYSQL_USERNAME
          password: YOUR_MYSQL_PASSWORD
          driver-class-name: com.mysql.cj.jdbc.Driver
        tenant_1002:
          url: jdbc:mysql://YOUR_MYSQL_HOST:YOUR_MYSQL_PORT/sample_ds_tenant_1002?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
