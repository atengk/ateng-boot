server:
  port: 8080

spring:
  application:
    name: ateng-boot-sample-mqtt
  config:
    import: "optional:classpath:application-local.yml"

ateng:
  boot:
    mqtt:
      enabled: true
      default-client: primary
      consumer:
        ack-mode: AUTO_AFTER_CONSUME
        max-retries: 2
        initial-backoff: 50ms
        max-backoff: 500ms
        backoff-multiplier: 2.0
      dlt:
        retained: false
        peek-broker-fallback: true
        max-records-per-topic: 1000
        max-total-records: 10000
      clients:
        primary:
          server-uri: tcp://127.0.0.1:1883
          client-id: ateng-sample-primary
          client-id-strategy: RANDOM_SUFFIX
          clean-start: true
          connection-timeout: 5s
          keep-alive-interval: 30s
          automatic-reconnect: true
          max-buffered-messages: 1000
          publish-timeout: 5s

management:
  endpoint:
    health:
      show-details: always
  health:
    mqtt:
      enabled: true
  metrics:
    enable:
      mqtt: true
