server:
  port: 8080

spring:
  application:
    name: ateng-boot-sample-liteflow
  config:
    import: "optional:classpath:application-local.yml"

liteflow:
  enable: true
  support-multiple-type: true
  rule-source: classpath*:liteflow/*.el.xml

ateng:
  boot:
    liteflow:
      enabled: true
      trace:
        slow-chain-threshold: 150ms
        slow-node-threshold: 60ms
      dynamic-rule:
        evict-removed-on-refresh: true
