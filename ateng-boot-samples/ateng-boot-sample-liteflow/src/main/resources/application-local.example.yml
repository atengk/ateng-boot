# 本地调试与特定环境覆盖配置模板（复制为 application-local.yml 即可生效，已被 .gitignore 自动纳管）
server:
  port: 8080

liteflow:
  enable: true
  support-multiple-type: true
  rule-source: classpath*:liteflow/*.el.xml
  # 可选：配置多线程线程池隔离
  # when-max-wait-seconds: 15
  # print-execution-log: true

ateng:
  boot:
    liteflow:
      enabled: true
