spring:
  application:
    name: ateng-boot-samples
  datasource:
    url: jdbc:h2:mem:sampledb;DB_CLOSE_DELAY=-1;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true

ateng:
  boot:
    web:
      trace:
        enabled: true
      long-to-string: true
      log:
        enabled: true
    mybatis-plus:
      pagination:
        max-limit: 500
        overflow: false
      block-attack:
        enabled: true
      optimistic-locker:
        enabled: true
      audit:
        enabled: true
        default-operator: SYSTEM
    redis:
      enabled: false
