server:
  port: 8080

spring:
  application:
    name: ateng-boot-sample-document

ateng:
  boot:
    document:
      enabled: true
      in-memory-threshold: 10MB
      temp-dir: ""
      word:
        template-base-dir: "classpath:/templates/"
      pdf:
        font-path: classpath:fonts/sample-cjk.ttf
      watermark:
        default-text: "内部绝密 严禁外传"
        opacity: 0.25
        rotation: -35.0
        font-size: 22.0
        color: "#CC0000"
        row-spacing: 120.0
        col-spacing: 180.0
