# ==============================================================================
# 本地真实中间件联调模板 (Local Profile Example Template)
# 使用说明：
# 1. 复制本文件为 application-local.yml 并填入真实的中间件连接信息（已被 .gitignore 忽略）
# 2. 激活 local Profile 或直接启动应用即可直连真实 Redis 验证轻量集群互斥锁与原子 Lua 释放
# ==============================================================================

spring:
  data:
    redis:
      host: YOUR_REDIS_HOST
      port: 6379
      password: YOUR_REDIS_PASSWORD
      database: 0
      timeout: 3s

ateng:
  boot:
    job:
      local:
        cluster-lock:
          type: REDIS # 显式声明使用 Redis 轻量集群互斥锁 (RedisJobClusterLockProvider)
          key-prefix: "ateng:job:lock:"
          default-lease-time: 5m
