spring:
  application:
    name: ateng-boot-sample-rocketmq
  config:
    import: "optional:classpath:application-local.yml"

ateng:
  boot:
    rocketmq:
      enabled: true
      endpoints: "127.0.0.1:8081"
      request-timeout: 3s
      producer:
        max-attempts: 3
        max-batch-size: 500
        max-payload-size: 4MB
        compression-threshold: 4KB
        topics:
          - sample_order_topic
          - sample_delay_topic
          - sample_fifo_topic
          - sample_tx_topic
          - sample_sql_topic
      consumer:
        consumption-thread-count: 20
        max-cache-message-count: 1024
      simple-consumer:
        invisible-duration: 30s
        max-message-num: 32
        await-duration: 5s
      dead-letter:
        max-replay-attempts: 3
        default-batch-size: 32
        max-batch-size: 100
        invisible-duration: 30s

logging:
  level:
    root: INFO
    io.github.atengk.boot.rocketmq: INFO
