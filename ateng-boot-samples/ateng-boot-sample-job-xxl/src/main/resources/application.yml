spring:
  application:
    name: ateng-boot-sample-job-xxl
  config:
    import: "optional:classpath:application-local.yml"

server:
  port: 8080

ateng:
  boot:
    job:
      xxl:
        enabled: true
        admin-addresses: http://127.0.0.1:8080/xxl-job-admin
        appname: xxl-job-sample-executor
        access-token: default_token
        port: 9999
        log-path: ./logs/xxl-job/jobhandler
        log-retention-days: 7
        timeout: 3s
        managed-pool-enabled: true
        alert-enabled: true
        alert-suppress-duration: 5m
        alert-suppress-threshold: 3

management:
  endpoints:
    web:
      exposure:
        include: "health,info,metrics,xxljobs"
  endpoint:
    health:
      show-details: always
