spring:
  application:
    name: ateng-boot-sample-basic
  datasource:
    url: jdbc:h2:mem:sampledb;DB_CLOSE_DELAY=-1;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true

ateng:
  boot:
    web:
      trace:
        enabled: true
      long-to-string: true
      log:
        enabled: true
      shutdown:
        drain-timeout: 0s
    mybatis-plus:
      pagination:
        max-limit: 500
        overflow: false
      block-attack:
        enabled: true
      optimistic-locker:
        enabled: true
      audit:
        enabled: true
        default-operator: SYSTEM
      dynamic-sql:
        enabled: true
