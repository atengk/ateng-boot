server:
  port: 8080

spring:
  application:
    name: ateng-boot-sample-excel
  config:
    import: "optional:classpath:application-local.yml"

ateng:
  boot:
    excel:
      enabled: true
      async-export:
        download-url-prefix: "/sample/excel/async/download?taskId="
    web:
      trace:
        enabled: true
      long-to-string: true
      log:
        enabled: true
