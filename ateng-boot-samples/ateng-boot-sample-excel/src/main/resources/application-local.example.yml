# 本地真实 Redis 联调配置示例模板（请复制为 application-local.yml 并填入真实连接串）
# 真实 application-local.yml 已被根目录 .gitignore 忽略，绝对严禁提交公网真实 IP 与密码凭据至 Git
spring:
  config:
    activate:
      on-profile: local
  data:
    redis:
      host: YOUR_REDIS_HOST
      port: 6379
      password: YOUR_REDIS_PASSWORD
      database: 0
      timeout: 3000ms

ateng:
  boot:
    excel:
      async-export:
        redis:
          enabled: true
          key-prefix: "ateng:excel:sample-async:"
          ttl: 24h
