# 本地真实服务联调配置模板 (复制为 application-local.yml 并激活 local profile 生效)
# 警告：真实密钥请勿提交至 Git 仓库！
ateng:
  boot:
    ai:
      model:
        base-url: https://api.deepseek.com/v1
        api-key: YOUR_DEEPSEEK_API_KEY
        model-name: deepseek-chat
        timeout: 60s
      models:
        reasoner:
          base-url: https://api.deepseek.com/v1
          api-key: YOUR_DEEPSEEK_API_KEY
          model-name: deepseek-reasoner
          timeout: 120s
        qwen:
          base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
          api-key: YOUR_DASHSCOPE_API_KEY
          model-name: qwen-plus
          timeout: 60s
      # 全维可观测审计与 PII 脱敏配置
      audit:
        enabled: true
        mask-pii: true
        log-payload: true
      # SaaS 多租户模型切源映射 (tenantId -> modelName)
      tenant-models:
        tenant-finance: reasoner
        tenant-vip: qwen
      # 多租户配额风控配置
      quota:
        enabled: true
        daily-request-limit: 1000
        daily-token-limit: 1000000
        tenant-request-limits:
          tenant-vip: 10000
          tenant-free: 50
        tenant-token-limits:
          tenant-vip: 10000000
          tenant-free: 50000
      # 内容安全双向护栏配置
      guardrail:
        enabled: true
        mode: FAIL_FAST
        max-prompt-length: 5000
        banned-keywords:
          - 涉黄涉暴
          - 违禁品
          - 枪支
          - 毒品
        whitelist:
          - 枪支管理条例
