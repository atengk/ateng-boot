server:
  port: 8080

spring:
  application:
    name: ateng-boot-sample-storage
  config:
    import: "optional:classpath:application-local.yml"

ateng:
  boot:
    storage:
      primary: default
      guard:
        enabled: true
        strict-magic-check: true
      chunk-cleaner:
        enabled: true
        interval: 1h
        max-age: 24h
      sources:
        default:
          type: local
          local:
            base-path: target/sample-storage/default
            domain: http://localhost:8080
            secret-key: sample-test-secret-key-32-bytes-minimum!
            download-endpoint: /storage/local/download
            upload-endpoint: /storage/local/upload
        backup:
          type: local
          local:
            base-path: target/sample-storage/backup
            domain: http://localhost:8080
            secret-key: sample-test-secret-key-32-bytes-minimum!
            download-endpoint: /storage/local/download
            upload-endpoint: /storage/local/upload
        s3:
          type: s3
          s3:
            endpoint: ${S3_ENDPOINT:http://localhost:9000}
            bucket: ${S3_BUCKET:ateng-test}
            access-key: ${S3_ACCESS_KEY:mock-access-key}
            secret-key: ${S3_SECRET_KEY:mock-secret-key}
            region: ${S3_REGION:us-east-1}
            path-style: true
            connect-timeout: 10s
            socket-timeout: 30s
            api-call-timeout: 60s
            max-connections: 50
            auto-create-bucket: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
