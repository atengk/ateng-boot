# 本地真实中间件联调模板文件（复制为 application-local.yml 并在本地环境激活）
# 真实 application-local.yml 已被 .gitignore 忽略，绝对严禁提交公网真实 IP 与密码凭据至 Git
ateng:
  boot:
    storage:
      sources:
        s3:
          type: s3
          s3:
            endpoint: YOUR_S3_ENDPOINT
            bucket: YOUR_S3_BUCKET
            access-key: YOUR_S3_ACCESS_KEY
            secret-key: YOUR_S3_SECRET_KEY
            region: us-east-1
            path-style: true
            connect-timeout: 10s
            socket-timeout: 30s
            api-call-timeout: 60s
            max-connections: 50
            auto-create-bucket: false
            default-storage-class: STANDARD
            # default-server-side-encryption: AES256 # 仅当 S3/RustFS/MinIO 服务端已配置 KMS 或主密钥时开启
