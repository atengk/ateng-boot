# 本地服务联调配置模板（请复制为 application-local.yml 并填入真实 SnailJob 与 Redis 连接信息）
# 真实 application-local.yml 已被 .gitignore 忽略，绝对严禁提交公网真实 IP 与密码凭据至 Git
spring:
  data:
    redis:
      host: YOUR_REDIS_HOST
      port: 6379
      password: YOUR_REDIS_PASSWORD
      database: 0
      timeout: 3s

ateng:
  boot:
    job:
      snail:
        server: YOUR_SNAIL_JOB_SERVER_HOST:17888
        group: YOUR_SNAIL_JOB_GROUP
        namespace: default
        token: YOUR_SNAIL_JOB_TOKEN
        openapi:
          port: 8080
          prefix: snail-job
        retry:
          enabled: true
          context-ttl: 24h
          local-max-attempts: 3
          local-backoff: 200ms
