server:
  port: 8080

spring:
  application:
    name: ateng-boot-sample-redis
  config:
    import: "optional:classpath:application-local.yml"

ateng:
  boot:
    redis:
      enabled: true
      cache:
        enabled: true
        expires:
          sys-dict: 2h
      two-level:
        enabled: true
        l1:
          ttls:
            user-profile: 10m
      delay-queue:
        enabled: true
      stream:
        enabled: true
      bloom-filters:
        user-blacklist:
          expected-insertions: 50000
          false-probability: 0.01
