spring:
  application:
    name: ateng-boot-sample-redis

ateng:
  boot:
    redis:
      enabled: true
      delay-queue:
        enabled: true
      bloom-filters:
        user-blacklist:
          expected-insertions: 50000
          false-probability: 0.01
    web:
      trace:
        enabled: true
      log:
        enabled: true
