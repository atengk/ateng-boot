# 本地真实搜索引擎联调模板文件（复制为 application-local.yml 并在本地环境激活）
# 严禁将真实凭据填入本 example 文件，真实配置文件 application-local.yml 已被 .gitignore 忽略
spring:
  config:
    activate:
      on-profile: local

ateng:
  boot:
    search:
      enabled: true
      engine: elasticsearch # 引擎类型：elasticsearch 或 opensearch
      uris:
        - http://YOUR_SEARCH_HOST:YOUR_SEARCH_PORT
      connection-timeout: 2s
      socket-timeout: 5s
