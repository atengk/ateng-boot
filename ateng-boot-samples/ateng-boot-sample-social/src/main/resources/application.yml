server:
  port: 8080

spring:
  application:
    name: ateng-boot-sample-social
  config:
    import: "optional:classpath:application-local.yml"

ateng:
  boot:
    social:
      enabled: true
      connect-timeout: 3s
      read-timeout: 3s
      state-timeout: 5m
      bind-ticket-timeout: 5m
      allowed-redirect-domains:
        - "ateng.example.com"
        - "*.example.com"
        - "localhost"
      controller:
        enabled: true
        prefix: /auth/social
      apps:
        github_app:
          source: GITHUB
          client-id: sample_github_client_id
          client-secret: sample_github_client_secret
          redirect-uri: http://localhost:8080/auth/social/callback/github_app
        wechat_mp_app:
          source: WECHAT_MINI_PROGRAM
          client-id: sample_wx_appid
          client-secret: sample_wx_secret
          ignore-check-state: true
          ignore-check-redirect-uri: true
        wechat_auto_app:
          source: WECHAT_MINI_PROGRAM
          client-id: sample_wx_auto_appid
          client-secret: sample_wx_auto_secret
          ignore-check-state: true
          ignore-check-redirect-uri: true
          auto-sign-up: true
        baidu_app:
          source: BAIDU
          client-id: sample_baidu_client_id
          client-secret: sample_baidu_client_secret
          redirect-uri: http://localhost:8080/auth/social/callback/baidu_app
        huawei_pkce_app:
          source: HUAWEI_V3
          client-id: sample_huawei_client_id
          client-secret: sample_huawei_client_secret
          redirect-uri: http://localhost:8080/sample/social/oauth/callback/huawei_pkce_app
          pkce: true
        qq_mini_app:
          source: QQ_MINI_PROGRAM
          client-id: sample_qq_mini_appid
          client-secret: sample_qq_mini_secret
          ignore-check-state: true
          ignore-check-redirect-uri: true
        wechat_snapshot_guard_app:
          source: WECHAT_MP
          client-id: sample_wx_mp_appid
          client-secret: sample_wx_mp_secret
          redirect-uri: http://localhost:8080/sample/social/oauth/callback/wechat_snapshot_guard_app
          ignore-check-state: true
          reject-snapshot-user: true
