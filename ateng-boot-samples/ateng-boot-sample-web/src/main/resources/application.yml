server:
  port: 8080

spring:
  application:
    name: ateng-boot-sample-web
  threads:
    virtual:
      enabled: true

ateng:
  boot:
    web:
      trace:
        enabled: true
      long-to-string: true
      log:
        enabled: true
      shutdown:
        drain-timeout: 0s
      ratelimit:
        enabled: true
      idempotent:
        enabled: true
      sign:
        enabled: true
