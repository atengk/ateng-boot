server:
  port: 8080

spring:
  application:
    name: ateng-boot-sample-web
  threads:
    virtual:
      enabled: true

ateng:
  boot:
    web:
      enabled: true
      long-to-string: true
      trace:
        enabled: true
        header-name: "X-Trace-Id"
      log:
        enabled: true
      shutdown:
        enabled: true
        drain-timeout: 0s
      ratelimit:
        enabled: true
      idempotent:
        enabled: true
      sign:
        enabled: true
        secret-key: "TestSecretKey123"
        app-id: "test-app"
        expire: 60s
      slow-request:
        enabled: true
        threshold: 3s
        exclude-urls:
          - "/actuator/**"
          - "/api/sample/runtime/slow-excluded"
      operate-log:
        enabled: true
      body-cache:
        max-body-size: 2MB
