<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>验证码通知</title>
</head>
<body>
    <div style="font-family: Arial, sans-serif; padding: 20px;">
        <h2>安全验证码通知</h2>
        <p>尊敬的 <strong th:text="${username}">用户</strong>：</p>
        <p>您的动态验证码为：<b style="font-size: 24px; color: #16a34a;" th:text="${code}">123456</b></p>
        <p>该验证码有效期为 5 分钟，请勿向任何人泄露。</p>
    </div>
</body>
</html>
